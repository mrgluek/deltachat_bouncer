services:
  bot:
    build: .
    container_name: deltachat_bouncer
    init: true
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./data:/app/data
      - ./data/bouncer:/root/.config/bouncer
      - ./data/cmping_cache:/root/.cache/cmping
      - ./data/cmcall_cache:/root/.cache/cmcall
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - PORT=8080
      - BASE_URL
      - DC_DB_DIR=/app/data
      - DB_PATH=/app/data/bouncer.db
      - TZ=UTC
      - DISPLAY_NAME
      - STATUS_TEXT
      - AVATAR_PATH
      - CMPING_MONITOR_INTERVAL
      - CALL_ECHO
      - CALL_ECHO_WHO
      - CALL_ECHO_DELAY
      - CALL_ECHO_MAX_SECONDS
      - CALL_ECHO_MAX_CONCURRENT
      - CALL_ECHO_STUN
      - CALL_ECHO_LOG_DAYS
      - CALL_DEBUG_LOG
      - CMCALL_MONITOR_INTERVAL
      - CMCALL_MONITOR_DURATION
      - CMCALL_DEGRADED_LOSS_PCT
      - MEET_TOTAL_SLOTS
      - MEET_MAX_ROOMS
      - MEET_MAX_PARTICIPANTS
      - MEET_IDLE_MINUTES
      - MEET_MAX_HOURS
      - MEET_RING_SECONDS
      - MEET_MAX_ROOMS_PER_USER
      - MEET_MUSIC_VOLUME
      - MEET_MUSIC_DUCK
      - VIRUSTOTAL_API_KEY
      - U2NET_HOME=/app/data/u2net
      - REMBG_HOME=/app/data/u2net
      - ENABLE_REMBG
      - REMBG_MODEL
      - REMBG_PRIORITY
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
