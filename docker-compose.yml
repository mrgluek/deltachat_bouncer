services:
  bot:
    build: .
    container_name: deltachat_bouncer
    init: true
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./data:/app/data
      - ./data/bouncer:/root/.config/bouncer
      - ./data/cmping_cache:/root/.cache/cmping
      - ./data/cmcall_cache:/root/.cache/cmcall
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - PORT=8080
      - BASE_URL
      - DC_DB_DIR=/app/data
      - DB_PATH=/app/data/bouncer.db
      - TZ=UTC
      - DISPLAY_NAME
      - STATUS_TEXT
      - AVATAR_PATH
      - CMPING_MONITOR_INTERVAL
      - CALL_ECHO
      - CALL_ECHO_WHO
      - CALL_ECHO_DELAY
      - CALL_ECHO_MAX_SECONDS
      - CALL_ECHO_MAX_CONCURRENT
      - VIRUSTOTAL_API_KEY
      - U2NET_HOME=/app/data/u2net
      - REMBG_HOME=/app/data/u2net
      - ENABLE_REMBG
      - REMBG_MODEL
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
